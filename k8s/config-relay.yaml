apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-relay
  namespace: vitalconnect-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-relay
  template:
    metadata:
      labels:
        app: config-relay
    spec:
      containers:
        - name: config-relay
          image: REGION-docker.pkg.dev/PROJECT_ID/vitalconnect-demo/config-relay:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: config-relay
  namespace: vitalconnect-demo
spec:
  selector:
    app: config-relay
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
