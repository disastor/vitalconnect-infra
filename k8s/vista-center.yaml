apiVersion: apps/v1
kind: Deployment
metadata:
  name: vista-center
  namespace: vitalconnect-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vista-center
  template:
    metadata:
      labels:
        app: vista-center
    spec:
      containers:
        - name: vista-center
          image: REGION-docker.pkg.dev/PROJECT_ID/vitalconnect-demo/vista-center:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: CONFIG_RELAY_URL
              value: "http://config-relay:4000"
            - name: VITALPATCH_URL
              value: "http://vitalpatch-api:4001"
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vista-center
  namespace: vitalconnect-demo
spec:
  selector:
    app: vista-center
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
