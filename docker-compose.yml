version: "3.9"
# config-relay is intentionally not run here anymore -- vista-center and
# vitalpatch-api now talk to CloudBees Unify directly via rox-node. Its
# code/Dockerfile is kept in the repo as the "before" reference for the
# demo, but it's no longer part of the live path.
services:
  vitalpatch-api:
    build: ./vitalpatch-api
    ports: ["4001:4001"]
    environment:
      - UNIFY_SDK_KEY=${UNIFY_SDK_KEY}

  vista-center:
    build: ./vista-center
    ports: ["8080:8080"]
    environment:
      - UNIFY_SDK_KEY=${UNIFY_SDK_KEY}
      - VITALPATCH_URL=http://vitalpatch-api:4001
    depends_on: [vitalpatch-api]
